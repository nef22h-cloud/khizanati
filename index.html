<style>

.inp{margin-bottom:8px}

.empty{text-align:center;color:var(--mut);padding:30px 12px;line-height:1.9}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px}

.card{transition:border-color .2s,transform .2s}details.fold[open]>summary{margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h1{font-weight:600;letter-spacing:-.2px}.btn{box-shadow:0 6px 16px -10px var(--ac)}.btn.alt,.btn.red{box-shadow:none}
.board{cursor:zoom-in}

/* ===== futuristic scanner ===== */
.scanbox{position:relative;border-radius:28px;overflow:hidden;background:#fff;margin-top:10px;box-shadow:0 18px 40px -24px rgba(20,22,27,.35)}
.scanbox img{width:100%;max-height:340px;object-fit:contain;display:block;background:#fff}

function compat(){const grp={top:["bottom","shoes"],bottom:["top","shoes"],shoes:["top","bottom"],jacket:["top","bottom"]},rows=[];
 items.forEach(i=>{const g=grp[i.cat];if(!g)return;const os=items.filter(o=>g.includes(o.cat));if(os.length<2)return;let ok=0;os.forEach(o=>{if(score([i,o])>=80)ok++});rows.push({i,f:ok/os.length,ok,n:os.length})});return rows}
function analysisHTML(){const c=k=>items.filter(i=>i.cat==k).length,T=c("top"),B=c("bottom"),S=c("shoes"),H=c("thobe"),J=c("jacket"),g=[],neu=i=>NEU.includes(i.color);
 let nm=0;for(const o of OCC){const n=k=>items.filter(i=>i.cat==k&&i.occ.includes(o)&&fits(i,o)).length,t=n("top"),b=n("bottom"),h=n("thobe"),s=n("shoes"),m=[];if(!h){if(!t)m.push("قميص أو تيشيرت");if(!b)m.push("بنطلون")}if(!s)m.push("حذاء");if(m.length&&nm++<3)g.push(`ما عندك ${m.join(" ولا ")} يناسب «${o}»`)}
 const tot=OCC.filter(o=>{const n=k=>items.filter(i=>i.cat==k&&i.occ.includes(o)&&fits(i,o)).length;return(!n("thobe")&&(!n("top")||!n("bottom")))||!n("shoes")}).length;if(tot>3)g.push(`وفيه ${tot-3} مناسبات ثانية ناقصها قطع، أضف قطع جديدة أو عدّل مناسبات قطعك`);
 if(T&&B&&Math.max(T,B)>=3*Math.min(T,B)&&Math.min(T,B)<=3)g.push(`عندك ${T} تيشيرتات وقمصان و${B} بناطيل، زيادة ${T>B?"بنطلون":"قميص"} تضاعف تركيباتك`);
 if(!S&&items.length>=3)g.push("ما عندك أي حذاء");
 if(items.length>=5&&!J&&!items.some(i=>["سويتر","هودي","معطف","بشت"].includes(i.sub)))g.push("ما عندك شي للبرد (جاكيت أو سويتر)");
 if(items.length>=5&&items.filter(i=>["top","bottom","thobe"].includes(i.cat)&&(i.season||"all")!="cold"&&!HOT_NO.includes(i.sub)).length<3)g.push("قطعك الخفيفة قليلة للجو الحار");
 if(B&&!items.some(i=>i.cat=="bottom"&&neu(i)))g.push("بناطيلك كلها ألوان قوية، أضف بنطلون أسود أو كحلي أو بيج يركب مع كل شي");
 if(T>=3&&items.filter(i=>i.cat=="top"&&!neu(i)).length>T*.6)g.push("أغلب قمصانك ألوان قوية، أضف أساسيات (أبيض أو أسود أو كحلي) تسهّل التنسيق");
 if(items.length>=6&&items.every(neu))g.push("كل قطعك ألوان محايدة، لو تبي لمسة لون أضف قطعة زيتي أو أزرق");
 const combos=(T*B+H)*Math.max(S,1);
 let h=`<details class="card fold" ${fk("gap")}><summary>🔍 وش ينقصك</summary>${combos?`<div class="note">تركيبات ممكنة تقريباً: ${combos}</div>`:""}${g.length?g.map(x=>`<div class="note" style="margin-top:8px">• ${x}</div>`).join(""):`<div class="note" style="margin-top:8px">خزانتك متوازنة 👌</div>`}</details>`;
 const rows=compat();if(rows.length>=4){const st=l=>`<div class="strip">${l.map(r=>`<div class="day" onclick="edit(${r.i.id})"><div class="t" style="grid-template-columns:1fr"><img src="${r.i.img}" alt="" loading="lazy" decoding="async"></div>${Math.round(r.f*100)}%</div>`).join("")}</div>`,
  best=[...rows].filter(r=>r.f>=.7).sort((a,b)=>b.f-a.f||b.n-a.n).slice(0,5),worst=[...rows].filter(r=>r.f<=.4).sort((a,b)=>a.f-b.f).slice(0,5);
  if(best.length||worst.length)h+=`<details class="card fold" ${fk("cmp")}><summary>🎯 تنسيق قطعك</summary>${best.length?`<div class="note" style="margin-top:8px">أكثر قطع تركب مع غيرها</div>`+st(best):""}${worst.length?`<div class="note" style="margin-top:8px">قطع صعب تتنسق (نسبة التركيبات الحلوة)</div>`+st(worst):""}</details>`}
 return h}
async function saveFile(name,data){

  try{
   const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(data instanceof Blob?data:new Blob([data]))});
   const r=await C.Plugins.Filesystem.writeFile({path:name,data:b64,directory:"CACHE"});

  }catch(e){if(e&&/cancel/i.test(String(e.message||e)))return}
 }
